name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=line -p no:cacheprovider 2>&1 | tee /tmp/pytest.log || { grep -E "FAILED|ERROR|Error|assert" /tmp/pytest.log | tail -n 40 | sed 's/^/::error::/'; exit 1; }
